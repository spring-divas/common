# Reusable CI for Spring Divas Gradle/Java services.
# Runs Checkstyle -> build -> tests.
#
# Caller must grant: contents: read, checks: write, pull-requests: read

name: Java CI

on:
  workflow_call:
    inputs:
      java-version:
        description: "JDK version to build with"
        type: string
        default: "25"

# read-only baseline; the test job elevates what it needs for the test report
permissions:
  contents: read

jobs:

  # ---------- static analysis ----------

  checkstyle:
    name: Checkstyle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest
      - name: Show violations on failure
        if: failure()
        run: |
          echo "checkstyle violations found:"
          cat build/reports/checkstyle/*.xml || true
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: build/reports/checkstyle/

  pmd:
    name: PMD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Run PMD
        run: ./gradlew pmdMain pmdTest
      - name: Show violations on failure
        if: failure()
        run: |
          echo "pmd violations found:"
          cat build/reports/pmd/*.xml || true
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pmd-report
          path: build/reports/pmd/

  # ---------- build ----------

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [checkstyle, pmd]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build jar
        run: ./gradlew bootJar
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: build/libs/*.jar

  # ---------- test ----------

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      checks: write     # dorny/test-reporter
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests
        run: ./gradlew test

      - name: Publish JUnit test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JUnit Tests
          path: "build/test-results/test/TEST-*.xml"
          reporter: java-junit
